<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFZ-Arbeitsplatz</title>
<style>
  :root {
    --bg: #eef1f5; --side: #ffffff; --panel: #ffffff; --panel2: #f3f5f8; --fg: #15202b; --muted: #5d6b7a; --line: #d5dce4;
    --accent: #1f6fd6; --on-accent: #ffffff; --warn: #a86400; --crit: #c92a2a; --good: #19804a; --hi: #c47a00;
    --FT: #1f6fd6; --ET: #9a7400; --FR: #0c8a80; --PX: #c4661a; --MK: #7a4fc9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1621; --side: #111b27; --panel: #17222f; --panel2: #1d2938; --fg: #e6edf3; --muted: #8d9aa8; --line: #283646;
      --accent: #5aa8ff; --on-accent: #06131f; --warn: #f5a524; --crit: #f46a6a; --good: #45d182; --hi: #f5b13d;
      --FT: #5aa8ff; --ET: #f2c94c; --FR: #2fc4b4; --PX: #f0a04b; --MK: #b394f5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1621; --side: #111b27; --panel: #17222f; --panel2: #1d2938; --fg: #e6edf3; --muted: #8d9aa8; --line: #283646;
    --accent: #5aa8ff; --on-accent: #06131f; --warn: #f5a524; --crit: #f46a6a; --good: #45d182; --hi: #f5b13d;
    --FT: #5aa8ff; --ET: #f2c94c; --FR: #2fc4b4; --PX: #f0a04b; --MK: #b394f5;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: var(--fg); }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.small { padding: 4px 9px; font-size: 13px; }
  button.ghost { background: none; border-color: transparent; }
  button.danger { color: var(--crit); }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Kopfleiste */
  .top { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--side); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: var(--fg); text-decoration: none; margin-right: 6px; }
  .brand .logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 19px; }
  #q { flex: 1 1 220px; max-width: 460px; border-radius: 999px; padding: 8px 16px; }
  .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; margin-left: auto; }
  .me { text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
  #menuBtn { display: none; }

  .shell { flex: 1; display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 0; }
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 12px 10px; overflow-y: auto; }
  main { overflow-y: auto; padding: 18px 28px 40px; }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  /* Seitenleiste */
  .nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; text-decoration: none; color: var(--fg); font-weight: 600; }
  .nav:hover { background: var(--panel2); }
  .nav.on { background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color: var(--c, var(--accent)); }
  .nav .ic { width: 22px; text-align: center; }
  .nav .cnt { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .nav .cnt.alert { color: var(--crit); font-weight: 700; }
  .sec { margin: 16px 10px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; text-decoration: none; color: var(--fg); font-weight: 600; font-size: 14px; background: var(--panel2); }
  .chip.on { border-color: var(--accent); color: var(--accent); }

  /* Inhalt */
  .crumb { color: var(--accent); font-size: 13px; }
  h1 { margin: 0; font-size: 28px; }
  h2 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  h2 .grow, .grow { flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card.mark { border-left: 4px solid var(--c, var(--hi)); }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: color-mix(in srgb, var(--hi) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--hi) 55%, var(--line)); border-radius: 10px; padding: 9px 14px; }
  .banner .grow { min-width: 200px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; background: var(--panel2); border-radius: 9px; }
  .row.cur { outline: 2px solid var(--accent); }
  .row.done { opacity: .55; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .tm { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .f { display: inline-block; min-width: 30px; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .04em; border-radius: 6px; padding: 2px 6px;
       background: color-mix(in srgb, var(--c, var(--muted)) 20%, transparent); color: var(--c, var(--muted)); }
  .kl { font-weight: 700; }
  .topic { color: var(--muted); }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.crit { color: var(--crit); } .badge.warn { color: var(--warn); } .badge.good { color: var(--good); } .badge.mut { color: var(--muted); }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

  /* Jetzt-Karte */
  .now { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
  .now .big { font-size: 22px; font-weight: 700; }
  .now .rest { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; text-align: right; }
  .now .rest.warn { color: var(--warn); }
  .prog { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--c, var(--accent)); }

  /* Tabellen */
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0 4px; }
  .tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 8px; }
  .tbl td { background: var(--panel2); padding: 7px 8px; vertical-align: middle; }
  .tbl td:first-child { border-radius: 8px 0 0 8px; } .tbl td:last-child { border-radius: 0 8px 8px 0; }
  .tbl tr.cur td { background: color-mix(in srgb, var(--accent) 16%, var(--panel2)); }
  .tbl tr.done td { opacity: .6; }
  .scroll { overflow-x: auto; }
  .week { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 640px; }
  .week th { font-size: 13px; color: var(--muted); }
  .week td { padding: 0; }
  .week .slot { width: 100%; min-height: 48px; text-align: left; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; border-radius: 8px; }
  .week .slot.has { background: color-mix(in srgb, var(--c) 16%, var(--panel2)); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .week .slot small { color: var(--muted); }
  .week .pz td { text-align: center; font-size: 12px; color: var(--muted); }
  .week .pz label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .week .tcell { white-space: nowrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bellrow { display: grid; grid-template-columns: 110px 90px 100px 100px auto; gap: 6px; align-items: center; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px 18px; }
  .settings label { display: flex; align-items: center; gap: 8px; }
  .settings input[type=number] { width: 64px; text-align: right; }

  /* To-dos */
  .todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 8px 10px; background: var(--panel2); border-radius: 9px; border-left: 4px solid transparent; }
  .todo.wichtig { border-left-color: var(--crit); }
  .todo input[type=checkbox] { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--accent); }
  .todo .t { font-weight: 600; overflow-wrap: anywhere; }
  .todo .m { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .todo.erl .t { text-decoration: line-through; opacity: .6; }
  .todo .act { grid-row: 1 / 3; grid-column: 3; display: flex; gap: 2px; }
  .todo .act button { padding: 3px 7px; }
  .colhead { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .grp { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
  .grp.crit { color: var(--crit); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: none; }
  .seg button.on { background: var(--accent); color: var(--on-accent); }

  .pin { padding: 10px 12px; background: var(--panel2); border-radius: 9px; display: flex; flex-direction: column; gap: 4px; }
  .pin .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .pin .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--fg); padding: 18px; width: min(460px, calc(100% - 24px)); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog form { display: flex; flex-direction: column; gap: 10px; }
  dialog h3 { margin: 0 0 4px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .fld.chk { flex-direction: row; align-items: center; color: var(--fg); font-size: 15px; }
  .fld input, .fld select, .fld textarea { color: var(--fg); font-size: 15px; }
  .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .dlg-btns .danger { margin-right: auto; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    aside { position: fixed; top: 0; bottom: 0; left: 0; width: 280px; z-index: 50; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.4); }
    body.menu aside { transform: none; }
    #menuBtn { display: inline-block; }
    main { padding: 14px 16px 40px; }
    .two { grid-template-columns: minmax(0, 1fr); }
    .bellrow { grid-template-columns: 1fr 1fr; }
    .brand span:last-child { display: none; }
    .now .rest { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print { aside, .top, button { display: none !important; } .shell { display: block; } main { overflow: visible; } }
</style>
</head>
<body>
<header class="top">
  <button id="menuBtn" aria-label="Menü öffnen">☰</button>
  <a class="brand" href="#/start"><span class="logo">⚙</span><span>KFZ-Arbeitsplatz</span></a>
  <input id="q" type="search" placeholder="Suchen … (z. B. Ohmsches Gesetz, 3A, Prüfung)" aria-label="Suchen">
  <span class="clock" id="clock">--:--</span>
  <button id="timerBtn" title="Unterrichtstimer öffnen – Stundenende wird aus der Klingel übernommen">⏱ Timer</button>
  <button id="syncBtn" title="Mit der Team-Datei abgleichen" hidden>⇅</button>
  <a class="me" id="meBtn" href="#/team">👤 Name eintragen</a>
</header>
<div class="shell">
  <aside id="side" aria-label="Navigation"></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="erinnerung.js"></script>
<script>
(() => {
  'use strict';
  const E = window.Erinnerung;
  const $ = id => document.getElementById(id);
  const COLS = ['stoff', 'aufgaben', 'notizen', 'termine', 'personen', 'log'];
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'], WTL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const FORMAT = 'kfz-arbeitsplatz-team';
  const { pad, norm, uhr } = E;

  // ---------- Daten ----------
  function laden() {
    const s = E.laden();
    s.ich = Object.assign({ name: '', klasse: '' }, s.ich || {});
    s.team = s.team && typeof s.team === 'object' ? s.team : {};
    COLS.forEach(c => { if (!Array.isArray(s.team[c])) s.team[c] = []; });
    s.ui = Object.assign({ fk: {}, todoFilter: 'offen', erinnert: [] }, s.ui || {});
    return s;
  }
  let S = laden();
  let syncTimer = null;
  function save(ohneSync) {
    try { localStorage.setItem(E.KEY, JSON.stringify(S)); } catch (e) { E.toast({ art: 'ende', titel: 'Speichern fehlgeschlagen', text: 'Der Browser erlaubt keinen Speicher (privates Fenster?).' }); }
    if (!ohneSync && fh) { clearTimeout(syncTimer); syncTimer = setTimeout(() => abgleichen(false), 4000); }
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const alive = c => S.team[c].filter(x => !x.del);
  function put(c, item, still) {
    item.id = item.id || uid(); item.upd = Date.now(); item.von = S.ich.name || '';
    if (!item.autor) item.autor = S.ich.name || '';
    const i = S.team[c].findIndex(x => x.id === item.id);
    if (i >= 0) S.team[c][i] = item; else S.team[c].push(item);
    save(); if (!still) render();
    return item;
  }
  function drop(c, id) {
    const i = S.team[c].findIndex(x => x.id === id); if (i < 0) return;
    const x = S.team[c][i];
    S.team[c][i] = { id: x.id, del: true, upd: Date.now(), von: S.ich.name || '', privat: x.privat || undefined };
    save(); render();
  }
  const valid = x => x && typeof x === 'object' && typeof x.id === 'string' && x.id.length < 60 && Number.isFinite(x.upd);
  function merge(other) {
    let n = 0;
    COLS.forEach(c => {
      (other && Array.isArray(other[c]) ? other[c] : []).forEach(x => {
        if (!valid(x) || x.privat) return;
        const i = S.team[c].findIndex(y => y.id === x.id);
        if (i < 0) { S.team[c].push(x); n++; }
        else if (x.upd > (S.team[c][i].upd || 0)) { S.team[c][i] = x; n++; }
      });
    });
    return n;
  }
  // Was an Kolleginnen und Kollegen geht: alles außer privaten To-dos
  const teamTeil = () => { const t = {}; COLS.forEach(c => { t[c] = S.team[c].filter(x => !x.privat); }); return t; };
  const paket = () => ({ format: FORMAT, version: 1, stand: new Date().toISOString(), von: S.ich.name || '', team: teamTeil() });

  // ---------- Hilfen ----------
  function h(tag, props, ...kids) {
    const el = document.createElement(tag); let val;
    if (props) for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'value') val = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k in el && typeof v !== 'string') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach(c => { if (c != null && c !== false) el.append(c instanceof Node ? c : String(c)); });
    if (val !== undefined) el.value = val;
    return el;
  }
  const fachC = k => E.FAECHER.some(f => f.k === k) ? `--c:var(--${k})` : '';
  const F = k => h('span', { class: 'f', style: fachC(k), title: E.fach(k).name }, k || '–');
  const iso = d => E.datum(d);
  const heute = () => iso(new Date());
  const addTage = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const parseISO = s => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
  const tageBis = s => { const d = parseISO(s); if (!d) return null; const t = parseISO(heute()); return Math.round((d - t) / 864e5); };
  function tagLabel(s) {
    const n = tageBis(s), d = parseISO(s);
    if (n === 0) return 'heute'; if (n === 1) return 'morgen'; if (n === -1) return 'gestern';
    return d ? `${WT[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.` : '';
  }
  const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); const hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (hh ? hh + ':' + pad(m) : m) + ':' + pad(s % 60); };
  const klassen = () => {
    const set = new Map();
    S.plan.forEach(e => e.klasse && set.set(norm(e.klasse), e.klasse.trim()));
    alive('stoff').forEach(x => x.klasse && set.set(norm(x.klasse), x.klasse.trim()));
    return [...set.values()].sort((a, b) => a.localeCompare(b, 'de', { numeric: true }));
  };
  const stoffVon = (f, k) => alive('stoff').filter(x => x.fach === f && norm(x.klasse) === norm(k)).sort((a, b) => (a.pos || 0) - (b.pos || 0) || a.upd - b.upd);
  const aktuellesThema = (f, k) => stoffVon(f, k).find(x => x.status !== 'fertig') || null;
  const gebraucht = id => alive('log').filter(l => l.stoffId === id && (l.erg === 'geschafft' || l.erg === 'nicht ganz')).reduce((a, l) => a + (+l.std || 1), 0);

  // Formular-Dialog: liefert Werte, 'del' oder null
  function formular(titel, felder, werte = {}, opt = {}) {
    return new Promise(res => {
      const dlg = $('dlg'), f = $('dlgForm'), inputs = {};
      f.textContent = '';
      f.append(h('h3', null, titel));
      if (opt.hinweis) f.append(h('p', { class: 'note' }, opt.hinweis));
      felder.forEach(fd => {
        let el;
        if (fd.type === 'select') el = h('select', null, fd.options.map(([v, l]) => h('option', { value: v }, l)));
        else if (fd.type === 'textarea') el = h('textarea', { rows: 4 });
        else el = h('input', { type: fd.type || 'text', step: fd.step, min: fd.min, max: fd.max, placeholder: fd.ph || '', maxlength: fd.max ? null : '300' });
        if (fd.type === 'checkbox') el.checked = !!(werte[fd.k] ?? fd.def);
        else el.value = werte[fd.k] ?? fd.def ?? '';
        if (fd.req) el.required = true;
        if (fd.list) { const id = 'dl' + uid(); el.setAttribute('list', id); f.append(h('datalist', { id }, fd.list.map(v => h('option', { value: v })))); }
        inputs[fd.k] = el;
        f.append(h('label', { class: 'fld' + (fd.type === 'checkbox' ? ' chk' : '') }, fd.type === 'checkbox' ? [el, h('span', null, fd.label)] : [h('span', null, fd.label), el]));
      });
      f.append(h('div', { class: 'dlg-btns' },
        opt.loeschen ? h('button', { value: 'del', class: 'danger', formnovalidate: true }, 'Löschen') : null,
        h('button', { value: 'cancel', formnovalidate: true }, 'Abbrechen'),
        h('button', { value: 'ok', class: 'primary' }, opt.ok || 'Speichern')));
      dlg.onclose = () => {
        if (dlg.returnValue === 'del') return res('del');
        if (dlg.returnValue !== 'ok') return res(null);
        const out = {};
        for (const [k, el] of Object.entries(inputs)) out[k] = el.type === 'checkbox' ? el.checked : el.value.trim();
        res(out);
      };
      dlg.returnValue = ''; dlg.showModal();
      const first = f.querySelector('input:not([type=checkbox]),select,textarea'); if (first) first.focus();
    });
  }
  const fachOptionen = leer => [...(leer ? [['', leer]] : []), ...E.FAECHER.map(f => [f.k, `${f.icon} ${f.name}`])];
  const personenNamen = () => [...new Set([S.ich.name, ...alive('personen').map(p => p.name)].filter(Boolean))];

  // ---------- Timer ----------
  function timerOeffnen(ende, titel) {

  // Stunden, deren Ergebnis noch fehlt (heute und die letzten 7 Tage, ab dem ersten Planeintrag)
  function offeneRueckmeldungen() {
    const now = Date.now(), out = [], seit = S.ui.seit || heute();
    for (let i = 7; i >= 0; i--) {
      const d = addTage(new Date(), -i), key = iso(d);
      if (key < seit) continue;
      const gruppen = new Map();
      E.tag(d, S).forEach(x => {
        if (!x.eintrag || x.ende - 5 * 6e4 > now) return;
        const g = `${x.eintrag.fach}|${norm(x.eintrag.klasse)}`;
        if (!gruppen.has(g)) gruppen.set(g, { tag: key, e: x.eintrag, zeiten: [], std: 0 });
        const gr = gruppen.get(g);
        if (!gr.zeiten.length || gr.letzt !== x.i - 1) gr.zeiten.push(x.von);
        gr.letzt = x.i; gr.std++;
      });
      gruppen.forEach(g => {
        const key2 = `${g.tag}|${g.e.fach}|${norm(g.e.klasse)}`;
        if (!alive('log').some(l => l.key === key2)) out.push(Object.assign(g, { key: key2 }));
      });
    }
    return out.reverse();
  }

  }

      const opts = { types: [{ description: 'Team-Datei', accept: { 'application/json': ['.json'] } }] };
      const handle = neu ? await window.showSaveFilePicker(Object.assign({ suggestedName: 'kfz-team.json' }, opts)) : (await window.showOpenFilePicker(opts))[0];
      fh = handle; await idb('readwrite', st => st.put(handle, 'teamdatei'));
      await abgleichen(true);
    } catch (e) { if (e && e.name !== 'AbortError') E.toast({ art: 'ende', titel: 'Team-Datei', text: String(e.message || e) }); }
  }
  function download(name, obj) {
    const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' })), download: name });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $('fileIn').onchange = async ev => {
    const file = ev.target.files[0]; ev.target.value = ''; if (!file) return;
    try {
      const j = JSON.parse(await file.text());
      if (j && j.format === FORMAT) { const n = merge(j.team); save(); render(); E.toast({ art: 'pause', titel: 'Import fertig', text: `${n} neue oder geänderte Einträge übernommen` + (j.von ? ` (von ${j.von})` : '') + '.' }); }
      else if (j && j.format === 'kfz-arbeitsplatz-sicherung' && j.daten) {
        const v = await formular('Sicherung wiederherstellen?', [], {}, { ok: 'Wiederherstellen', hinweis: 'Ersetzt Stundenplan, Klingelzeiten und Einstellungen. Team-Einträge werden zusammengeführt, nicht gelöscht.' });
        if (!v) return;
        const team = S.team; S = Object.assign(laden(), j.daten); S.team = team; COLS.forEach(c => { if (!Array.isArray(S.team[c])) S.team[c] = []; });
        merge(j.daten.team || {}); (j.daten.team && COLS.forEach(c => (j.daten.team[c] || []).filter(x => valid(x) && x.privat && !S.team[c].some(y => y.id === x.id)).forEach(x => S.team[c].push(x))));
        save(); render();
      } else throw new Error('Unbekanntes Dateiformat.');
    } catch (e) { E.toast({ art: 'ende', titel: 'Import fehlgeschlagen', text: String(e.message || e) }); }
  };
  async function personDialog(x) {
    const v = await formular(x ? 'Kollegin/Kollege bearbeiten' : 'Kollegin/Kollege hinzufügen', [
      { k: 'name', label: 'Name', req: true },
      ...E.FAECHER.map(f => ({ k: 'f_' + f.k, label: `${f.icon} ${f.name}`, type: 'checkbox' })),
      { k: 'klassen', label: 'Klassen', ph: 'z. B. 1A, 2B, 3A' },
      { k: 'kontakt', label: 'Kontakt (optional)', ph: 'Telefon oder E-Mail' },
    ], x ? Object.assign({}, x, Object.fromEntries((x.faecher || []).map(k => ['f_' + k, true]))) : {}, { loeschen: !!x });
    if (v === 'del') return drop('personen', x.id);
    if (!v) return;
    put('personen', Object.assign({}, x || {}, { name: v.name, klassen: v.klassen, kontakt: v.kontakt, faecher: E.FAECHER.filter(f => v['f_' + f.k]).map(f => f.k) }));
  }
  function viewTeam() {
    const w = [h('div', { class: 'crumb' }, '⌂ Organisation › Team'), h('h1', null, 'Team & Austausch')];
    w.push(h('section', { class: 'card' }, h('h2', null, '👤 Ich'),
      h('div', { class: 'settings' },
        h('label', null, 'Name', h('input', { value: S.ich.name, placeholder: 'z. B. G. Peer', onchange: ev => { S.ich.name = ev.target.value.trim(); save(true); render(); } })),
        h('label', null, 'Klassenvorstand', h('input', { value: S.ich.klasse, placeholder: 'z. B. 3A', onchange: ev => { S.ich.klasse = ev.target.value.trim(); save(true); } }))),
      h('p', { class: 'note' }, 'Der Name steht bei deinen Einträgen, damit Kolleginnen und Kollegen sehen, von wem eine Änderung kommt.')));

    w.push(h('section', { class: 'card' }, h('h2', null, '👥 Fachlehrer-Team', h('span', { class: 'grow' }), h('button', { class: 'small', onclick: () => personDialog() }, '+ Person')),
      alive('personen').length ? h('div', { class: 'list' }, alive('personen').sort((a, b) => a.name.localeCompare(b.name, 'de')).map(p => h('div', { class: 'row' },
        h('b', null, p.name), (p.faecher || []).map(F), p.klassen ? h('span', { class: 'note' }, p.klassen) : null, p.kontakt ? h('span', { class: 'note' }, p.kontakt) : null,
        h('span', { class: 'grow' }), h('button', { class: 'small ghost', 'aria-label': 'Bearbeiten', onclick: () => personDialog(p) }, '✎'))))
        : h('div', { class: 'empty' }, 'Noch niemand eingetragen.')));

    w.push(h('section', { class: 'card mark', style: '--c:var(--accent)' }, h('h2', null, '⇅ Gemeinsame Team-Datei'),
      h('p', { class: 'note' }, 'So arbeitet ihr zusammen, ohne Server: Eine Datei kfz-team.json liegt in einem gemeinsamen Ordner (OneDrive, Teams, Google Drive oder Netzlaufwerk). Jede Person verbindet sie einmal. Danach gleicht das Programm Stoffverteilung, Pinnwand, Termine, Team-Aufgaben und Rückmeldungen jede Minute ab. Private To-dos, Stundenplan und Klingelzeiten bleiben auf deinem Gerät.'),
      fsOk ? h('div', { class: 'row', style: 'background:none;padding:0' },
        fh ? [h('span', null, '📄 ', h('b', null, fh.name)), h('button', { class: 'primary small', onclick: () => abgleichen(true) }, 'Jetzt abgleichen'),
          h('button', { class: 'small', onclick: async () => { fh = null; await idb('readwrite', st => st.delete('teamdatei')); syncInfo = ''; render(); } }, 'Trennen')]
          : [h('button', { class: 'primary small', onclick: () => dateiVerbinden(false) }, 'Vorhandene Team-Datei öffnen'), h('button', { class: 'small', onclick: () => dateiVerbinden(true) }, 'Neue Team-Datei anlegen')])
        : h('p', { class: 'note', style: 'color:var(--warn)' }, 'Dieser Browser kann keine Datei dauerhaft verbinden (geht in Chrome und Edge am Computer). Nutze stattdessen Exportieren/Importieren.'),
      syncInfo ? h('p', { class: 'note' }, syncInfo) : S.ui.sync ? h('p', { class: 'note' }, 'Zuletzt abgeglichen: ' + new Date(S.ui.sync).toLocaleString('de-DE')) : null));

    w.push(h('section', { class: 'card' }, h('h2', null, '📦 Per Datei weitergeben'),
      h('p', { class: 'note' }, 'Ohne gemeinsamen Ordner: Team-Daten exportieren und per Mail/Teams schicken. Beim Importieren wird zusammengeführt – nichts geht verloren, die neuere Änderung gewinnt.'),
      h('div', { class: 'row', style: 'background:none;padding:0' },
        h('button', { class: 'small', onclick: () => download(`kfz-team-${heute()}.json`, paket()) }, '⇡ Team-Daten exportieren'),
        h('button', { class: 'small', onclick: () => $('fileIn').click() }, '⇣ Datei importieren'),
        h('button', { class: 'small', onclick: () => download(`kfz-sicherung-${heute()}.json`, { format: 'kfz-arbeitsplatz-sicherung', version: 1, daten: S }) }, '💾 Komplette Sicherung'))));
    return w;
  }

  // ---------- Suche ----------
  function viewSuche(q) {
    const t = q.toLowerCase(), has = (...v) => v.some(x => typeof x === 'string' && x.toLowerCase().includes(t));
    const stoff = alive('stoff').filter(x => has(x.titel, x.hinweis, x.klasse, E.fach(x.fach).name));
    const todos = todoGruppen().all.filter(x => has(x.titel, x.notiz, x.klasse));
    const termine = alive('termine').filter(x => has(x.titel, x.klasse, x.art));
    const notizen = alive('notizen').filter(x => has(x.text, x.klasse));
    const w = [h('div', { class: 'crumb' }, '⌂ Suche'), h('h1', null, `Suche: „${q}“`)];
    if (stoff.length) w.push(h('section', { class: 'card' }, h('h2', null, '📚 Themen'), h('div', { class: 'list' }, stoff.map(x =>
      h('a', { class: 'row', href: '#/fach/' + x.fach, style: 'color:inherit;text-decoration:none', onclick: () => { S.ui.fk[x.fach] = x.klasse; save(true); } }, F(x.fach), h('span', { class: 'kl' }, x.klasse), h('span', null, x.titel), h('span', { class: 'badge mut' }, x.status || 'offen'))))));
    if (todos.length) w.push(h('section', { class: 'card' }, h('h2', null, '✅ To-dos'), h('div', { class: 'list' }, todos.map(todoZeile))));
    if (termine.length) w.push(h('section', { class: 'card' }, h('h2', null, '📌 Termine'), h('div', { class: 'list' }, termine.map(terminZeile))));
    if (notizen.length) w.push(h('section', { class: 'card' }, h('h2', null, '💬 Pinnwand'), h('div', { class: 'list' }, notizen.map(pinZeile))));
    if (w.length === 2) w.push(h('div', { class: 'empty' }, 'Nichts gefunden.'));
    return w;
  }
  let qTimer = null;
  $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { const v = $('q').value.trim(); location.hash = v ? '#/suche/' + encodeURIComponent(v) : '#/start'; }, 250); });

  // ---------- Rendern ----------
  function render() {
    const [r, a] = route();
    renderSide();
    const main = $('main'), y = main.scrollTop;
    const views = { start: viewStart, todo: viewTodo, fach: () => viewFach(a), plan: viewPlan, termine: viewTermine, team: viewTeam,
      pinnwand: () => [h('div', { class: 'crumb' }, '⌂ Organisation › Pinnwand'), h('h1', null, 'Pinnwand'), cardPinnwand(0)],
      klasse: () => viewKlasse(a || ''), suche: () => viewSuche(a || '') };
    main.textContent = '';
    main.append(h('div', { class: 'wrap' }, (views[r] || viewStart)()));
    main.scrollTop = y;
  }
  window.addEventListener('hashchange', () => { document.body.classList.remove('menu'); $('main').scrollTop = 0; render(); });
  $('menuBtn').onclick = () => document.body.classList.toggle('menu');
  document.addEventListener('click', e => { if (document.body.classList.contains('menu') && !e.target.closest('aside') && e.target !== $('menuBtn')) document.body.classList.remove('menu'); });
  window.addEventListener('storage', e => { if (e.key === E.KEY && !$('dlg').open) { S = laden(); render(); } });
  $('syncBtn').onclick = () => abgleichen(true);

  // Takt: Uhr, Jetzt-Karte, Erinnerungen
  let lastMin = -1;
  function tick() {
    const now = new Date();
    $('clock').textContent = uhr(now);
    const busy = $('dlg').open || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.id !== 'q');
    if (route()[0] === 'start' && $('jetzt')) { const j = $('jetzt'); j.textContent = ''; j.append(...jetztInhalt()); }
    if (now.getMinutes() !== lastMin) { lastMin = now.getMinutes(); todoErinnerungen(); if (!busy) render(); }
  }
  E.starten();
  setInterval(tick, 1000);
  setInterval(() => { if (fh && !document.hidden) abgleichen(false); }, 60000);
  if (fsOk) idb('readonly', st => st.get('teamdatei')).then(hd => { if (hd) { fh = hd; abgleichen(false); renderSide(); } }).catch(() => {});
  render(); tick();
})();
</script>
</body>
</html>
