<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFZ-Arbeitsplatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* Schwarzes Design: immer dunkel; hell nur über data-theme="light" */
  :root {
    --bg: #000000; --side: #050507; --panel: #0d0d10; --panel2: #15151a; --fg: #f4f4f6; --muted: #8a8a96; --line: #202027;
    --accent: #4f8cff; --accent2: #8b5cf6; --on-accent: #ffffff; --warn: #ffb020; --crit: #ff5b5b; --good: #34d399; --hi: #ffb020;
    --FT: #4f8cff; --ET: #ffd23f; --FR: #2ee6c5; --PX: #ff8a3d; --MK: #b18cff;
    --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 16px; --glow: 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 8px 28px color-mix(in srgb, var(--accent) 30%, transparent);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f4f7; --side: #ffffff; --panel: #ffffff; --panel2: #f2f3f6; --fg: #121218; --muted: #5f6270; --line: #dfe1e7;
    --accent: #2563eb; --accent2: #7c3aed; --warn: #b45309; --crit: #dc2626; --good: #15803d; --hi: #b45309;
    --FT: #2563eb; --ET: #a16207; --FR: #0f766e; --PX: #c2410c; --MK: #7c3aed; color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: var(--fg); }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.small { padding: 4px 9px; font-size: 13px; }
  button.ghost { background: none; border-color: transparent; }
  button.danger { color: var(--crit); }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Kopfleiste */
  .top { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--side); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: var(--fg); text-decoration: none; margin-right: 6px; }
  .brand .logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 19px; }
  #q { flex: 1 1 220px; max-width: 460px; border-radius: 999px; padding: 8px 16px; }
  .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; margin-left: auto; }
  .me { text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
  #menuBtn { display: none; }

  .shell { flex: 1; display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 0; }
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 12px 10px; overflow-y: auto; }
  main { overflow-y: auto; padding: 18px 28px 40px; }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  /* Seitenleiste */
  .nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; text-decoration: none; color: var(--fg); font-weight: 600; }
  .nav:hover { background: var(--panel2); }
  .nav.on { background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color: var(--c, var(--accent)); }
  .nav .ic { width: 22px; text-align: center; }
  .nav .cnt { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .nav .cnt.alert { color: var(--crit); font-weight: 700; }
  .sec { margin: 16px 10px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; text-decoration: none; color: var(--fg); font-weight: 600; font-size: 14px; background: var(--panel2); }
  .chip.on { border-color: var(--accent); color: var(--accent); }

  /* Inhalt */
  .crumb { color: var(--accent); font-size: 13px; }
  h1 { margin: 0; font-size: 28px; }
  h2 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  h2 .grow, .grow { flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card.mark { border-left: 4px solid var(--c, var(--hi)); }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: color-mix(in srgb, var(--hi) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--hi) 55%, var(--line)); border-radius: 10px; padding: 9px 14px; }
  .banner .grow { min-width: 200px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; background: var(--panel2); border-radius: 9px; }
  .row.cur { outline: 2px solid var(--accent); }
  .row.done { opacity: .55; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .tm { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .f { display: inline-block; min-width: 30px; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .04em; border-radius: 6px; padding: 2px 6px;
       background: color-mix(in srgb, var(--c, var(--muted)) 20%, transparent); color: var(--c, var(--muted)); }
  .kl { font-weight: 700; }
  .topic { color: var(--muted); }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.crit { color: var(--crit); } .badge.warn { color: var(--warn); } .badge.good { color: var(--good); } .badge.mut { color: var(--muted); }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

  /* Jetzt-Karte */
  .now { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
  .now .big { font-size: 22px; font-weight: 700; }
  .now .rest { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; text-align: right; }
  .now .rest.warn { color: var(--warn); }
  .prog { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--c, var(--accent)); }

  /* Tabellen */
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0 4px; }
  .tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 8px; }
  .tbl td { background: var(--panel2); padding: 7px 8px; vertical-align: middle; }
  .tbl td:first-child { border-radius: 8px 0 0 8px; } .tbl td:last-child { border-radius: 0 8px 8px 0; }
  .tbl tr.cur td { background: color-mix(in srgb, var(--accent) 16%, var(--panel2)); }
  .tbl tr.done td { opacity: .6; }
  .scroll { overflow-x: auto; }
  .week { display: grid; grid-template-columns: repeat(var(--n), minmax(150px, 1fr)); gap: 8px; min-width: calc(var(--n) * 158px); }
  .day { display: flex; flex-direction: column; gap: 4px; }
  .day h3 { margin: 0 0 2px; font-size: 13px; color: var(--muted); text-align: center; }
  .day h3.heute { color: var(--accent); }
  .slot { width: 100%; min-height: 50px; text-align: left; display: flex; flex-direction: column; gap: 1px; padding: 5px 8px; border-radius: 8px; }
  .slot .tm { font-size: 11px; }
  .slot.has { background: color-mix(in srgb, var(--c) 16%, var(--panel2)); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .slot small { color: var(--muted); }
  .pz { font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 8px; border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 2px; }
  .pz label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; color: var(--fg); }
  .fa { font-size: 12px; text-align: center; color: var(--good); padding: 4px; font-weight: 600; }
  .bellrow { display: grid; grid-template-columns: 130px minmax(100px, 1fr) 124px 124px auto auto; gap: 6px; align-items: center; padding: 6px; border-radius: 9px; background: var(--panel2); }
  .bellrow.warn { outline: 2px solid var(--crit); }
  .bellrow.leer { opacity: .55; }
  .bellrow > .btns { margin-left: 0; flex-wrap: nowrap; justify-self: end; }
  .wd { display: inline-flex; gap: 3px; }
  .wd button { padding: 4px 0; width: 30px; font-size: 12px; border-radius: 7px; background: var(--bg); color: var(--muted); }
  .wd button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px 18px; }
  .settings label { display: flex; align-items: center; gap: 8px; }
  .settings input[type=number] { width: 64px; text-align: right; }

  /* To-dos */
  .todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 8px 10px; background: var(--panel2); border-radius: 9px; border-left: 4px solid transparent; }
  .todo.wichtig { border-left-color: var(--crit); }
  .todo input[type=checkbox] { width: 19px; height: 19px; margin-top: 2px; accent-color: var(--accent); }
  .todo .t { font-weight: 600; overflow-wrap: anywhere; }
  .todo .m { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .todo.erl .t { text-decoration: line-through; opacity: .6; }
  .todo .act { grid-row: 1 / 3; grid-column: 3; display: flex; gap: 2px; }
  .todo .act button { padding: 3px 7px; }
  .colhead { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .grp { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
  .grp.crit { color: var(--crit); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: none; }
  .seg button.on { background: var(--accent); color: var(--on-accent); }

  .pin { padding: 10px 12px; background: var(--panel2); border-radius: 9px; display: flex; flex-direction: column; gap: 4px; }
  .pin .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .pin .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--fg); padding: 18px; width: min(520px, calc(100% - 24px)); max-height: 90vh; overflow-y: auto; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog form { display: flex; flex-direction: column; gap: 10px; }
  dialog h3 { margin: 0 0 4px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .fld.chk { flex-direction: row; align-items: center; color: var(--fg); font-size: 15px; }
  .fld input, .fld select, .fld textarea { color: var(--fg); font-size: 15px; }
  .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .dlg-btns .danger { margin-right: auto; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    aside { position: fixed; top: 0; bottom: 0; left: 0; width: 280px; z-index: 50; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.4); }
    body.menu aside { transform: none; }
    #menuBtn { display: inline-block; }
    main { padding: 14px 16px 40px; }
    .two { grid-template-columns: minmax(0, 1fr); }
    .bellrow { grid-template-columns: 1fr 1fr; }
    .bellrow .wd { grid-column: 1 / -1; }
    .brand span:last-child { display: none; }
    .now .rest { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* Schalter (ein/aus) */
  .switches { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-top: 12px; border-top: 1px solid var(--line); }
  .sw { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; user-select: none; position: relative; }
  .sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sw .knob { width: 44px; height: 26px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); position: relative; transition: background .2s; flex: none; }
  .sw .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .sw input:checked + .knob { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent); }
  .sw input:checked + .knob::after { transform: translateX(18px); background: #fff; }
  .sw input:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Modernes Design ---------- */
  h1, h2, .brand, .now .big, .now .rest, .clock { font-family: var(--display); letter-spacing: -.01em; }
  h1 { font-size: 34px; font-weight: 700; }
  .crumb { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; font-weight: 600; color: var(--muted); }
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 10px 18px; }
  .brand .logo { border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 45%, transparent); }
  #q { background: var(--panel); border-color: var(--line); }
  #q:focus { border-color: var(--accent); outline: none; box-shadow: var(--glow); }
  .me { background: var(--panel); }
  aside { background: var(--side); }
  .nav { border-radius: 10px; font-weight: 500; color: color-mix(in srgb, var(--fg) 82%, var(--muted)); position: relative; transition: background .15s, color .15s; }
  .nav.on { background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); color: var(--fg); font-weight: 600; }
  .nav.on::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, var(--accent)); }
  .nav.on .ic { filter: drop-shadow(0 0 6px var(--c, var(--accent))); }
  .card { border-radius: var(--r); background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 100%, #fff 2%), var(--panel)); border-color: var(--line); padding: 18px 20px; transition: border-color .2s; }
  .card:hover { border-color: color-mix(in srgb, var(--line) 60%, var(--muted)); }
  .card.mark { border-left-width: 1px; box-shadow: inset 3px 0 0 var(--c, var(--hi)); }
  .card h2 { font-size: 18px; font-weight: 600; }
  button { border-radius: 10px; background: var(--panel2); border-color: var(--line); font-weight: 500; transition: border-color .15s, background .15s, box-shadow .15s, transform .05s; }
  button:hover:not(:disabled) { background: color-mix(in srgb, var(--panel2) 70%, var(--accent) 12%); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--accent2))); border-color: transparent; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent); }
  button.primary:hover:not(:disabled) { background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: var(--glow); }
  button.ghost { background: none; }
  input, select, textarea { background: color-mix(in srgb, var(--bg) 60%, var(--panel)); border-color: var(--line); border-radius: 10px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .row, .todo, .pin, .tbl td { background: var(--panel2); border: 1px solid transparent; }
  .row { border-radius: 12px; } .todo, .pin { border-radius: 12px; }
  .row.cur { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 24px color-mix(in srgb, var(--accent) 22%, transparent); }
  .todo.wichtig { border-left: 3px solid var(--crit); }
  .chip { background: var(--panel2); border-color: var(--line); }
  .chip.on, .chip:hover { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .f { border-radius: 7px; letter-spacing: .06em; }
  .seg { background: var(--panel2); border-color: var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg button { border-radius: 8px; }
  .seg button.on { background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent); }
  .now .rest { font-size: 56px; font-weight: 700; background: linear-gradient(180deg, var(--fg), color-mix(in srgb, var(--fg) 55%, var(--muted))); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .now .rest.warn { background: none; color: var(--warn); }
  .prog { height: 6px; background: var(--panel2); }
  .prog i { background: linear-gradient(90deg, var(--c, var(--accent)), color-mix(in srgb, var(--c, var(--accent)) 50%, var(--accent2))); box-shadow: 0 0 12px var(--c, var(--accent)); border-radius: 99px; }
  .banner { border-radius: 14px; background: color-mix(in srgb, var(--hi) 9%, var(--panel)); }
  .slot { background: var(--panel2); }
  .slot.has { box-shadow: inset 3px 0 0 var(--c); }
  .slot.aus { opacity: .7; }
  .slot .badge { align-self: flex-start; }
  .slot .fn { color: var(--c, var(--fg)); font-size: 14px; line-height: 1.25; }
  .slot .raw { font-size: 10px; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .pz { background: transparent; }
  .bellrow { border: 1px solid var(--line); background: var(--panel2); }
  dialog { border-radius: 20px; background: var(--panel); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  dialog::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(4px); }
  ::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  * { scrollbar-width: thin; scrollbar-color: #2a2a33 transparent; }
  .erin { background: var(--panel2) !important; border-radius: 14px !important; }

  @media print { aside, .top, button { display: none !important; } .shell { display: block; } main { overflow: visible; } }
</style>
</head>
<body>
<header class="top">
  <button id="menuBtn" aria-label="Menü öffnen">☰</button>
  <a class="brand" href="#/start"><span class="logo">⚙</span><span>KFZ-Arbeitsplatz</span></a>
  <input id="q" type="search" placeholder="Suchen … (z. B. Ohmsches Gesetz, 3A, Prüfung)" aria-label="Suchen">
  <span class="clock" id="clock">--:--</span>
  <button id="timerBtn" title="Unterrichtstimer öffnen – Stundenende wird aus der Klingel übernommen">⏱ Timer</button>
  <button id="syncBtn" title="Mit der Team-Datei abgleichen" hidden>⇅</button>
  <a class="me" id="regBtn" target="_blank" rel="noopener" hidden title="Digitales Register öffnen">📒 Register</a>
  <a class="me" id="meBtn" href="#/team">👤 Name eintragen</a>
</header>
<div class="shell">
  <aside id="side" aria-label="Navigation"></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="icsIn" accept=".ics,text/calendar" hidden>

<script src="erinnerung.js"></script>
<script>
(() => {
  'use strict';
  const E = window.Erinnerung;
  const $ = id => document.getElementById(id);
  const COLS = ['stoff', 'aufgaben', 'notizen', 'termine', 'personen', 'log'];
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'], WTL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const FORMAT = 'kfz-arbeitsplatz-team';
  const { pad, norm, uhr } = E;

  // ---------- Daten ----------
  function laden() {
    const s = E.laden();
    s.ich = Object.assign({ name: '', klasse: '' }, s.ich || {});
    s.team = s.team && typeof s.team === 'object' ? s.team : {};
    COLS.forEach(c => { if (!Array.isArray(s.team[c])) s.team[c] = []; });

  // ---------- WebUntis: iCal-Link oder .ics-Datei ----------
  // Kalender als feste Wochenvorlage übernehmen (für Zeiten ohne aktuellen WebUntis-Kalender)
  async function icsImport(roh) {
    const ev = roh.filter(e => !e.aus).map(e => ({ start: new Date(e.s), ende: new Date(e.e), sum: e.sum, ort: e.ort, besch: e.besch }));
    if (!ev.length) throw new Error('In der Datei sind keine Stunden mit Uhrzeit.');
    // Bezugswoche: die Woche mit den meisten Stunden ab dieser Woche (sonst die vollste überhaupt)
    const wkey = d => iso(addTage(d, -((d.getDay() + 6) % 7)));
    const wochen = new Map();
    ev.forEach(e => { const k = wkey(e.start); wochen.set(k, (wochen.get(k) || 0) + 1); });
    const ab = iso(montag());
    const kand = [...wochen].filter(([k]) => k >= ab).sort((a, b) => a[0].localeCompare(b[0])).slice(0, 6);
    const pool = kand.length ? kand : [...wochen];
    const woche = pool.reduce((a, b) => b[1] > a[1] ? b : a)[0];
    const wk = ev.filter(e => wkey(e.start) === woche && e.start.getDay() >= 1 && e.start.getDay() <= 6);

    // gleiche Fach/Klasse-Kombination nur einmal zuordnen
    const combos = new Map();
    wk.forEach(e => { const k = e.sum + '|' + e.besch; if (!combos.has(k)) combos.set(k, { sum: e.sum, besch: e.besch, n: 0 }); combos.get(k).n++; });
    const cl = [...combos.values()];
    const felder = [];
    cl.forEach((c, i) => {
      felder.push({ k: 'f' + i, label: `„${c.sum || '(ohne Titel)'}“${c.besch ? ' – ' + c.besch.slice(0, 60) : ''} (${c.n}× pro Woche)`, type: 'select', options: fachOptionen('– nicht übernehmen –'), def: E.zuordnung(c, S).fach });
      felder.push({ k: 'k' + i, label: 'Klasse', def: E.zuordnung(c, S).klasse, list: klassen() });
    });
    felder.push({ k: 'bell', label: 'Klingelzeiten dieser Tage aus WebUntis übernehmen (Pausen und Feierabend werden aus den Lücken abgeleitet)', type: 'checkbox', def: true });
    const tageImp = [...new Set(wk.map(e => e.start.getDay()))].sort();
    const mo = parseISO(woche);
    const v = await formular('Aus WebUntis übernehmen', felder, {}, { ok: 'Übernehmen',
      hinweis: `Woche ab ${pad(mo.getDate())}.${pad(mo.getMonth() + 1)}.: ${wk.length} Stunden an ${tageImp.map(t => WT[t]).join(', ')}. Ordne jeder Zeile dein Fach zu. Der bisherige Stundenplan dieser Tage wird ersetzt.` });
    if (!v) return;

    const zu = new Map(cl.map((c, i) => [c.sum + '|' + c.besch, { fach: v['f' + i], klasse: v['k' + i] }]));
    S.ui.icalMap = Object.assign(S.ui.icalMap || {}, Object.fromEntries(zu));
    const altBell = S.bell.map(b => Object.assign({}, b, { tage: tageVon(b).slice() }));
    const neueBell = [], neuerPlan = [];
    let ohneSlot = 0;
    tageImp.forEach(t => {
      const l = wk.filter(e => e.start.getDay() === t).sort((a, b) => a.start - b.start)
        .filter((e, k, arr) => k === 0 || +e.start !== +arr[k - 1].start);
      const hmv = d => uhr(d);
      if (v.bell) {
        const altTag = altBell.filter(b => b.tage.includes(t));
        const altSt = altTag.filter(b => b.typ === 'stunde' && E.hm(b.start) != null && E.hm(b.ende) > E.hm(b.start));
        const altFa = altTag.find(b => b.typ === 'feierabend');
        const mins = d => d.getHours() * 60 + d.getMinutes();
        const ueber = (b, e) => E.hm(b.start) < mins(e.ende) && E.hm(b.ende) > mins(e.start);
        const benutzt = new Set();
        // Stundennummer: gleiche Anfangszeit, sonst die erste überlappende Schulstunde, sonst fortlaufend
        const nrFuer = e => {
          const b = altSt.find(b => b.start === hmv(e.start) && !benutzt.has(String(b.nr))) || altSt.find(b => ueber(b, e) && !benutzt.has(String(b.nr)));
          let nr = b ? String(b.nr) : '';
          for (let z = 1; !nr || benutzt.has(nr); z++) nr = 'W' + z;
          benutzt.add(nr); return nr;
        };
        // Schulstunden ohne eigenen Unterricht bleiben (Freistunden zum Eintragen)
        l.forEach(e => nrFuer(e)); benutzt.clear();
        const frei = altSt.filter(b => !l.some(e => ueber(b, e)));
        l.forEach((e, k) => {
          const von = hmv(e.start), bis = hmv(e.ende), nr = nrFuer(e);
          neueBell.push({ typ: 'stunde', nr, start: von, ende: bis, tage: [t] });
          const z = zu.get(e.sum + '|' + e.besch);
          if (z && z.fach) neuerPlan.push({ tag: t, nr, fach: z.fach, klasse: z.klasse, raum: e.ort });
          const nx = l[k + 1];
          if (nx) {
            const gap = (nx.start - e.ende) / 6e4, sm = e.ende.getHours() * 60 + e.ende.getMinutes(), em = sm + gap;
            // bisherige Pausen der Schule behalten, wenn sie in diese Lücke fallen (WebUntis liefert nur die eigenen Stunden)
            const alt = altTag.filter(b => b.typ === 'pause' && E.hm(b.start) >= sm && E.hm(b.start) < em);
            alt.forEach(b => neueBell.push({ typ: 'pause', name: b.name || 'Pause', start: b.start, ende: E.hm(b.ende) <= em ? b.ende : hmv(nx.start), tage: [t] }));
            const mittag = sm < 14 * 60 && em > 11 * 60 + 30 && gap >= 30;
            if (!alt.length && gap >= 5 && (gap <= 35 || mittag))
              neueBell.push({ typ: 'pause', name: mittag ? 'Mittagspause' : sm < 12 * 60 ? 'Vormittagspause' : 'Nachmittagspause', start: bis, ende: hmv(nx.start), tage: [t] });
          }
        });
        frei.forEach(b => { if (!benutzt.has(String(b.nr))) { benutzt.add(String(b.nr)); neueBell.push({ typ: 'stunde', nr: String(b.nr), start: b.start, ende: b.ende, tage: [t] }); } });
        const last = hmv(l[l.length - 1].ende);
        neueBell.push({ typ: 'feierabend', name: 'Feierabend', start: altFa && altFa.start > last ? altFa.start : last, ende: '', tage: [t] });
      } else {
        const sl = E.tag(addTage(montag(), t - 1), S).filter(x => x.typ === 'stunde');
        l.forEach(e => {
          const z = zu.get(e.sum + '|' + e.besch); if (!z || !z.fach) return;
          const von = e.start.getHours() * 60 + e.start.getMinutes(), bis = e.ende.getHours() * 60 + e.ende.getMinutes();
          const treffer = sl.filter(x => E.hm(x.von) < bis && E.hm(x.bis) > von);
          if (!treffer.length) ohneSlot++;
          treffer.forEach(x => neuerPlan.push({ tag: t, nr: String(x.nr), fach: z.fach, klasse: z.klasse, raum: e.ort }));
        });
      }
    });
    if (v.bell) {
      // importierte Tage aus den alten Zeilen herausnehmen, gleiche neue Zeilen über die Tage zusammenfassen
      const rest = altBell.map(b => Object.assign(b, { tage: b.tage.filter(t => !tageImp.includes(t)) })).filter(b => b.tage.length);
      const merged = new Map();
      [...rest, ...neueBell].forEach(b => { const k = [b.typ, b.nr || '', b.name || '', b.start, b.ende].join('|'); if (merged.has(k)) merged.get(k).tage.push(...b.tage); else merged.set(k, b); });
      merged.forEach(b => b.tage.sort());
      S.bell = [...merged.values()];
      S.aufsicht = S.aufsicht.filter(a => !tageImp.includes(+a.split('|')[0]) || S.bell.some(b => b.typ === 'pause' && tageVon(b).includes(+a.split('|')[0]) && b.start === a.split('|')[1]));
    }
    S.plan = S.plan.filter(e => !tageImp.includes(+e.tag)).concat(neuerPlan);
    if (!S.ui.seit) S.ui.seit = heute();
    S.ui.icalStand = Date.now();
    save(true); render();
    E.toast({ art: 'pause', titel: 'WebUntis übernommen', text: `${neuerPlan.length} Stunden eingetragen` + (ohneSlot ? `, ${ohneSlot} passten zu keiner Klingelzeit` : '') + '. Bitte im Wochenplan kontrollieren.' });
  }
  $('icsIn').onchange = async ev => {
    const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
    try { const k = E.kalenderSpeichern(await f.text()); render(); E.toast({ art: 'pause', titel: 'WebUntis-Kalender geladen', text: `${k.ev.length} Stunden bis ${tagLabel(k.bis)} – bitte die Zuordnung der Fächer prüfen.` }); }
    catch (e) { E.toast({ art: 'ende', titel: 'WebUntis', text: String(e.message || e) }); }
  };
  const zuOptionen = () => [['', '– ignorieren (keine Erinnerung) –'], [E.VERTRETUNG, '🔁 Vertretung / nicht mein Fach (nur Erinnerung)'], [E.AUFSICHT, '👀 Pausenaufsicht'],
    ...E.alle().map(f => [f.k, `${f.icon} ${f.name}`])];
  async function zuordnenDialog(key, titel) {
    const i = key.indexOf('|'), z = E.zuordnung({ sum: key.slice(0, i), besch: key.slice(i + 1) }, S);
    const v = await formular(`WebUntis: „${titel || '–'}“`, [
      { k: 'fach', label: 'Was ist das?', type: 'select', options: zuOptionen() },
      { k: 'klasse', label: 'Klasse', list: klassen() },
    ], z, { hinweis: 'Gilt für alle Stunden mit diesem WebUntis-Eintrag.' });
    if (!v) return;
    S.ui.icalMap = Object.assign(S.ui.icalMap || {}, { [key]: { fach: v.fach, klasse: v.klasse } });
    save(true); render();
  }
  function cardWebuntis() {
    const k = E.kal(), app = !!(window.desk && window.desk.ical);
    const inp = h('input', { type: 'url', placeholder: 'https://…webuntis.com/WebUntis/Ical.do?…', value: S.ui.icalUrl || '', style: 'flex:1 1 260px', 'aria-label': 'iCal-Link aus WebUntis' });
    const fehler = k && k.fehler && (!k.stand || k.fehlerAm > k.stand)
      ? (k.fehler === 'BROWSER' ? 'Im Browser blockiert WebUntis den direkten Abruf. Lösung: die Windows-App (ruft den Link automatisch ab) oder die .ics-Datei hochladen.' : k.fehler) : '';
    const abrufen = async ev => {
      const b = ev.currentTarget; b.disabled = true; b.textContent = 'Lädt …';
      S.ui.icalUrl = inp.value.trim(); save(true);
      try { const r = await E.kalenderSync(true); if (r) E.toast({ art: 'pause', titel: 'WebUntis aktualisiert', text: `${r.ev.length} Stunden bis ${tagLabel(r.bis)}` }); }
      catch (e) { /* Fehler steht in der Karte */ }
      render();
    };
    const keys = new Map();
    (k ? k.ev : []).filter(e => !e.aus).forEach(e => { const key = E.icsKey(e); if (!keys.has(key)) keys.set(key, { e, n: 0 }); keys.get(key).n++; });
    const setMap = (key, m) => { S.ui.icalMap = Object.assign(S.ui.icalMap || {}, { [key]: m }); save(true); render(); };
    return h('section', { class: 'card' }, h('h2', null, '📅 WebUntis-Kalender (immer aktuell)'),
      h('p', { class: 'note' }, 'Den iCal-Link aus WebUntis einfügen – denselben, den du in Google Kalender verwendest. Er bleibt nur auf diesem Gerät und geht nicht in die Team-Datei. ' +
        (app ? 'Die App ruft ihn automatisch alle 30 Minuten ab: Vertretungen und Entfälle sind damit drin.' : 'Hier im Browser geht der automatische Abruf vermutlich nicht – dafür die Windows-App nutzen oder die .ics-Datei hochladen.')),
      h('div', { class: 'row', style: 'background:none;padding:0' }, inp,
        h('button', { class: 'primary small', onclick: abrufen }, 'Speichern & abrufen'),
        h('button', { class: 'small', onclick: () => $('icsIn').click() }, '.ics-Datei hochladen')),
      k && k.von ? h('p', { class: 'note', style: 'color:var(--good)' }, `✓ Stand ${new Date(k.stand).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })} · ${k.ev.length} Stunden vom ${tagLabel(k.von)} bis ${tagLabel(k.bis)}. An diesen Tagen gilt WebUntis statt der Wochenvorlage.`)
        : h('p', { class: 'note' }, 'Noch kein Kalender geladen – es gilt die Wochenvorlage.'),
      fehler ? h('p', { class: 'note', style: 'color:var(--crit)' }, '⚠ ' + fehler) : null,
      keys.size ? [h('div', { class: 'grp' }, 'Zuordnung: WebUntis → Fach'),
        h('div', { class: 'list' }, [...keys].sort((a, b) => b[1].n - a[1].n).map(([key, { e, n }]) => {
          const z = E.zuordnung(e, S);
          return h('div', { class: 'row' },
            h('span', { class: 'grow', style: 'min-width:160px' }, h('b', null, e.sum || '(ohne Titel)'), e.besch ? h('span', { class: 'note' }, ' ' + e.besch.slice(0, 60)) : null, h('span', { class: 'note' }, ` · ${n}×`)),
            h('select', { 'aria-label': 'Fach', value: z.fach, onchange: ev => setMap(key, { fach: ev.target.value, klasse: z.klasse }) }, zuOptionen().map(([v2, l]) => h('option', { value: v2 }, l))),
            h('input', { 'aria-label': 'Klasse', placeholder: 'Klasse', value: z.klasse, style: 'width:110px', onchange: ev => setMap(key, { fach: z.fach, klasse: ev.target.value.trim() }) }),
            z.fest ? null : h('span', { class: 'badge warn', title: 'Automatisch erkannt – bitte prüfen' }, 'Vorschlag'));
        }))] : null,
      k && k.ev.length ? h('div', { class: 'row', style: 'background:none;padding:0' },
        h('button', { class: 'small', onclick: () => icsImport(k.ev) }, 'Als feste Wochenvorlage übernehmen'),
        h('button', { class: 'small danger', onclick: () => { E.kalenderEntfernen(); render(); } }, 'Kalender entfernen')) : null);
  }

  // ---------- Team & Austausch ----------
  let fh = null; // Datei-Handle der Team-Datei
  const fsOk = 'showOpenFilePicker' in window && 'indexedDB' in window;
  const idb = (mode, fn) => new Promise((res, rej) => {
    const r = indexedDB.open('kfz-arbeitsplatz', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const tx = r.result.transaction('kv', mode), q = fn(tx.objectStore('kv')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); };
  });
  let syncInfo = '';
  async function abgleichen(interaktiv) {
    if (!fh) return;
    try {
      let p = await fh.queryPermission({ mode: 'readwrite' });
      if (p !== 'granted') {
        if (!interaktiv) { syncInfo = 'Zugriff abgelaufen – „Jetzt abgleichen“ klicken.'; renderSide(); if (route()[0] === 'team') render(); return; }
        p = await fh.requestPermission({ mode: 'readwrite' });
        if (p !== 'granted') { syncInfo = 'Zugriff verweigert.'; render(); return; }
      }
      const txt = await (await fh.getFile()).text();
      let n = 0, alt = '';
      if (txt.trim()) {
        const j = JSON.parse(txt);
        if (!j || j.format !== FORMAT) throw new Error('Die Datei ist keine Team-Datei dieses Programms.');
        n = merge(j.team); alt = JSON.stringify(j.team);
      }
      const neu = paket();
      if (JSON.stringify(neu.team) !== alt) { const wr = await fh.createWritable(); await wr.write(JSON.stringify(neu)); await wr.close(); }
      S.ui.sync = Date.now(); save(true);
      syncInfo = `Abgeglichen um ${uhr(Date.now())}` + (n ? ` · ${n} Änderungen von Kollegen übernommen` : '');
      if (n || interaktiv) render(); else renderSide();
    } catch (e) {
      syncInfo = 'Abgleich fehlgeschlagen: ' + (e && e.message || e);
      if (interaktiv) E.toast({ art: 'ende', titel: 'Abgleich fehlgeschlagen', text: String(e && e.message || e) });
      if (route()[0] === 'team') render();
    }
  }
  async function dateiVerbinden(neu) {
    try {
      const opts = { types: [{ description: 'Team-Datei', accept: { 'application/json': ['.json'] } }] };
      const handle = neu ? await window.showSaveFilePicker(Object.assign({ suggestedName: 'kfz-team.json' }, opts)) : (await window.showOpenFilePicker(opts))[0];
      fh = handle; await idb('readwrite', st => st.put(handle, 'teamdatei'));
      await abgleichen(true);
    } catch (e) { if (e && e.name !== 'AbortError') E.toast({ art: 'ende', titel: 'Team-Datei', text: String(e.message || e) }); }
  }
  function download(name, obj) {
    const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' })), download: name });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $('fileIn').onchange = async ev => {
    const file = ev.target.files[0]; ev.target.value = ''; if (!file) return;
    try {
      const j = JSON.parse(await file.text());
      if (j && j.format === FORMAT) { const n = merge(j.team); save(); render(); E.toast({ art: 'pause', titel: 'Import fertig', text: `${n} neue oder geänderte Einträge übernommen` + (j.von ? ` (von ${j.von})` : '') + '.' }); }
      else if (j && j.format === 'kfz-arbeitsplatz-sicherung' && j.daten) {
        const v = await formular('Sicherung wiederherstellen?', [], {}, { ok: 'Wiederherstellen', hinweis: 'Ersetzt Stundenplan, Klingelzeiten und Einstellungen. Team-Einträge werden zusammengeführt, nicht gelöscht.' });
        if (!v) return;
        const team = S.team; S = Object.assign(laden(), j.daten); S.team = team; COLS.forEach(c => { if (!Array.isArray(S.team[c])) S.team[c] = []; });
        merge(j.daten.team || {}); (j.daten.team && COLS.forEach(c => (j.daten.team[c] || []).filter(x => valid(x) && x.privat && !S.team[c].some(y => y.id === x.id)).forEach(x => S.team[c].push(x))));
        save(); render();
      } else throw new Error('Unbekanntes Dateiformat.');
    } catch (e) { E.toast({ art: 'ende', titel: 'Import fehlgeschlagen', text: String(e.message || e) }); }
  };
  async function personDialog(x) {
    const v = await formular(x ? 'Kollegin/Kollege bearbeiten' : 'Kollegin/Kollege hinzufügen', [
      { k: 'name', label: 'Name', req: true },
      ...E.alle().map(f => ({ k: 'f_' + f.k, label: `${f.icon} ${f.name}`, type: 'checkbox' })),
      { k: 'klassen', label: 'Klassen', ph: 'z. B. 1A, 2B, 3A' },
      { k: 'kontakt', label: 'Kontakt (optional)', ph: 'Telefon oder E-Mail' },
    ], x ? Object.assign({}, x, Object.fromEntries((x.faecher || []).map(k => ['f_' + k, true]))) : {}, { loeschen: !!x });
    if (v === 'del') return drop('personen', x.id);
    if (!v) return;
    put('personen', Object.assign({}, x || {}, { name: v.name, klassen: v.klassen, kontakt: v.kontakt, faecher: E.alle().filter(f => v['f_' + f.k]).map(f => f.k) }));
  }
  async function fachDialog(x) {
    const v = await formular(x ? 'Fach bearbeiten' : 'Fach hinzufügen', [
      { k: 'k', label: 'Kürzel (2–5 Großbuchstaben/Ziffern, wie in WebUntis)', req: true, ph: 'z. B. GK' },
      { k: 'name', label: 'Name', req: true, ph: 'z. B. Gemeinschaftskunde' },
      { k: 'icon', label: 'Symbol (ein Emoji)', ph: '📘' },
      { k: 'farbe', label: 'Farbe', type: 'color', def: '#94a3b8' },
      { k: 'ende', label: 'Tipp kurz vor Stundenende (optional)' },
    ], x || {}, { loeschen: !!x });
    const liste = (Array.isArray(S.faecher) ? S.faecher : E.EXTRA_VORGABE).map(f => Object.assign({}, f)).filter(f => !x || f.k !== x.k);
    if (v === 'del') { S.faecher = liste; save(true); render(); return; }
    if (!v) return;
    v.k = v.k.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    if (!v.k || E.FAECHER.some(f => f.k === v.k) || liste.some(f => f.k === v.k)) { E.toast({ art: 'ende', titel: 'Fach', text: 'Dieses Kürzel gibt es schon oder es ist leer.' }); return; }
    liste.push({ k: v.k, name: v.name, icon: v.icon || '📘', farbe: v.farbe, ende: v.ende });
    S.faecher = liste; save(true); render();
  }
  function cardFaecher() {
    return h('section', { class: 'card' }, h('h2', null, '📚 Fächer', h('span', { class: 'grow' }), h('button', { class: 'small', onclick: () => fachDialog() }, '+ Fach')),
      h('p', { class: 'note' }, 'Die fünf KFZ-Fächer sind fest. Weitere Fächer (z. B. Vertretungen) kannst du hier anlegen; das Kürzel hilft beim Erkennen in WebUntis.'),
      h('div', { class: 'chips', style: 'padding:0' }, E.alle().map(f => f.extra
        ? h('button', { class: 'chip', style: fachC(f.k), title: 'Bearbeiten', onclick: () => fachDialog(E.alle().find(y => y.k === f.k)) }, F(f.k), f.name, ' ✎')
        : h('span', { class: 'chip' }, F(f.k), f.name))));
  }
  function viewTeam() {
    const w = [h('div', { class: 'crumb' }, '⌂ Organisation › Team'), h('h1', null, 'Team & Austausch')];
    w.push(h('section', { class: 'card' }, h('h2', null, '👤 Ich'),
      h('div', { class: 'settings' },
        h('label', null, 'Name', h('input', { value: S.ich.name, placeholder: 'z. B. G. Peer', onchange: ev => { S.ich.name = ev.target.value.trim(); save(true); render(); } })),
        h('label', null, 'Klassenvorstand', h('input', { value: S.ich.klasse, placeholder: 'z. B. 3A', onchange: ev => { S.ich.klasse = ev.target.value.trim(); save(true); } })),
        h('label', null, 'Digitales Register', h('input', { type: 'url', value: S.ich.register || '', placeholder: 'https://deineschule.digitalesregister.it', onchange: ev => { S.ich.register = ev.target.value.trim(); save(true); renderSide(); } }))),
      h('p', { class: 'note' }, 'Der Name steht bei deinen Einträgen, damit Kolleginnen und Kollegen sehen, von wem eine Änderung kommt.')));

    w.push(cardFaecher());
    w.push(h('section', { class: 'card' }, h('h2', null, '👥 Fachlehrer-Team', h('span', { class: 'grow' }), h('button', { class: 'small', onclick: () => personDialog() }, '+ Person')),
      alive('personen').length ? h('div', { class: 'list' }, alive('personen').sort((a, b) => a.name.localeCompare(b.name, 'de')).map(p => h('div', { class: 'row' },
        h('b', null, p.name), (p.faecher || []).map(F), p.klassen ? h('span', { class: 'note' }, p.klassen) : null, p.kontakt ? h('span', { class: 'note' }, p.kontakt) : null,
        h('span', { class: 'grow' }), h('button', { class: 'small ghost', 'aria-label': 'Bearbeiten', onclick: () => personDialog(p) }, '✎'))))
        : h('div', { class: 'empty' }, 'Noch niemand eingetragen.')));

    w.push(h('section', { class: 'card mark', style: '--c:var(--accent)' }, h('h2', null, '⇅ Gemeinsame Team-Datei'),
      h('p', { class: 'note' }, 'So arbeitet ihr zusammen, ohne Server: Eine Datei kfz-team.json liegt in einem gemeinsamen Ordner (OneDrive, Teams, Google Drive oder Netzlaufwerk). Jede Person verbindet sie einmal. Danach gleicht das Programm Stoffverteilung, Pinnwand, Termine, Team-Aufgaben und Rückmeldungen jede Minute ab. Private To-dos, Stundenplan und Klingelzeiten bleiben auf deinem Gerät.'),
      fsOk ? h('div', { class: 'row', style: 'background:none;padding:0' },
        fh ? [h('span', null, '📄 ', h('b', null, fh.name)), h('button', { class: 'primary small', onclick: () => abgleichen(true) }, 'Jetzt abgleichen'),
          h('button', { class: 'small', onclick: async () => { fh = null; await idb('readwrite', st => st.delete('teamdatei')); syncInfo = ''; render(); } }, 'Trennen')]
          : [h('button', { class: 'primary small', onclick: () => dateiVerbinden(false) }, 'Vorhandene Team-Datei öffnen'), h('button', { class: 'small', onclick: () => dateiVerbinden(true) }, 'Neue Team-Datei anlegen')])
        : h('p', { class: 'note', style: 'color:var(--warn)' }, 'Dieser Browser kann keine Datei dauerhaft verbinden (geht in Chrome und Edge am Computer). Nutze stattdessen Exportieren/Importieren.'),
      syncInfo ? h('p', { class: 'note' }, syncInfo) : S.ui.sync ? h('p', { class: 'note' }, 'Zuletzt abgeglichen: ' + new Date(S.ui.sync).toLocaleString('de-DE')) : null));

    w.push(h('section', { class: 'card' }, h('h2', null, '📦 Per Datei weitergeben'),
      h('p', { class: 'note' }, 'Ohne gemeinsamen Ordner: Team-Daten exportieren und per Mail/Teams schicken. Beim Importieren wird zusammengeführt – nichts geht verloren, die neuere Änderung gewinnt.'),
      h('div', { class: 'row', style: 'background:none;padding:0' },
        h('button', { class: 'small', onclick: () => download(`kfz-team-${heute()}.json`, paket()) }, '⇡ Team-Daten exportieren'),
        h('button', { class: 'small', onclick: () => $('fileIn').click() }, '⇣ Datei importieren'),
        h('button', { class: 'small', onclick: () => download(`kfz-sicherung-${heute()}.json`, { format: 'kfz-arbeitsplatz-sicherung', version: 1, daten: Object.assign({}, S, { ui: Object.assign({}, S.ui, { icalUrl: undefined }) }) }) }, '💾 Komplette Sicherung'))));
    return w;
  }

  // ---------- Suche ----------
  function viewSuche(q) {
    const t = q.toLowerCase(), has = (...v) => v.some(x => typeof x === 'string' && x.toLowerCase().includes(t));
    const stoff = alive('stoff').filter(x => has(x.titel, x.hinweis, x.klasse, E.fach(x.fach).name));
    const todos = todoGruppen().all.filter(x => has(x.titel, x.notiz, x.klasse));
    const termine = alive('termine').filter(x => has(x.titel, x.klasse, x.art));
    const notizen = alive('notizen').filter(x => has(x.text, x.klasse));
    const w = [h('div', { class: 'crumb' }, '⌂ Suche'), h('h1', null, `Suche: „${q}“`)];
    if (stoff.length) w.push(h('section', { class: 'card' }, h('h2', null, '📚 Themen'), h('div', { class: 'list' }, stoff.map(x =>
      h('a', { class: 'row', href: '#/fach/' + x.fach, style: 'color:inherit;text-decoration:none', onclick: () => { S.ui.fk[x.fach] = x.klasse; save(true); } }, F(x.fach), h('span', { class: 'kl' }, x.klasse), h('span', null, x.titel), h('span', { class: 'badge mut' }, x.status || 'offen'))))));
    if (todos.length) w.push(h('section', { class: 'card' }, h('h2', null, '✅ To-dos'), h('div', { class: 'list' }, todos.map(todoZeile))));
    if (termine.length) w.push(h('section', { class: 'card' }, h('h2', null, '📌 Termine'), h('div', { class: 'list' }, termine.map(terminZeile))));
    if (notizen.length) w.push(h('section', { class: 'card' }, h('h2', null, '💬 Pinnwand'), h('div', { class: 'list' }, notizen.map(pinZeile))));
    if (w.length === 2) w.push(h('div', { class: 'empty' }, 'Nichts gefunden.'));
    return w;
  }
  let qTimer = null;
  $('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { const v = $('q').value.trim(); location.hash = v ? '#/suche/' + encodeURIComponent(v) : '#/start'; }, 250); });

  // ---------- Rendern ----------
  function render() {
    const [r, a] = route();
    renderSide();
    const main = $('main'), y = main.scrollTop;
    const views = { start: viewStart, todo: viewTodo, fach: () => viewFach(a), plan: viewPlan, termine: viewTermine, team: viewTeam,
      pinnwand: () => [h('div', { class: 'crumb' }, '⌂ Organisation › Pinnwand'), h('h1', null, 'Pinnwand'), cardPinnwand(0)],
      klasse: () => viewKlasse(a || ''), suche: () => viewSuche(a || '') };
    main.textContent = '';
    main.append(h('div', { class: 'wrap' }, (views[r] || viewStart)()));
    main.scrollTop = y;
  }
  window.addEventListener('hashchange', () => { document.body.classList.remove('menu'); $('main').scrollTop = 0; render(); });
  $('menuBtn').onclick = () => document.body.classList.toggle('menu');
  document.addEventListener('click', e => { if (document.body.classList.contains('menu') && !e.target.closest('aside') && e.target !== $('menuBtn')) document.body.classList.remove('menu'); });
  window.addEventListener('storage', e => { if (e.key === E.KEY && !$('dlg').open) { S = laden(); render(); } });
  $('syncBtn').onclick = () => abgleichen(true);

  // Takt: Uhr, Jetzt-Karte, Erinnerungen
  let lastMin = -1;
  function tick() {
    const now = new Date();
    $('clock').textContent = uhr(now);
    const busy = $('dlg').open || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.id !== 'q');
    if (route()[0] === 'start' && $('jetzt')) { const j = $('jetzt'); j.textContent = ''; j.append(...jetztInhalt()); }
    if (now.getMinutes() !== lastMin) { lastMin = now.getMinutes(); todoErinnerungen(); if (!busy) render(); }
  }
  E.starten(e => { if (e && e.art === 'kalender' && !$('dlg').open) render(); });
  setInterval(tick, 1000);
  setInterval(() => { if (fh && !document.hidden) abgleichen(false); }, 60000);
  if (fsOk) idb('readonly', st => st.get('teamdatei')).then(hd => { if (hd) { fh = hd; abgleichen(false); renderSide(); } }).catch(() => {});
  render(); tick();
})();
</script>
